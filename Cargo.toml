[package]
name = "ctf-pwn"
version = "0.4.0"
edition = "2021"
authors = ["Jovan Pavlovic"]
description = "Pwn utilities for Rust."
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ascii = "1.1.0"
bytes = "1.10.1"
futures = "0.3.31"
hex = "0.4.3"
kmp = "0.1.1"
pin-project-lite = "0.2.16"
regex = "1.11.1"
thiserror = "2.0.15"
tokio = { version = "1.47.1", features = ["bytes", "fs", "io-util", "macros", "net", "parking_lot", "process", "test-util", "time"] }
