[package]
name = "ctf-pwn"
version = "0.4.0"
edition = "2021"
authors = ["Jovan Pavlovic"]
description = "Pwn utilities for Rust."
license = "MIT"
repository = "https://github.com/rust-ctf/ctf-pwn"
keywords = ["ctf", "pwn", "exploit", "security"]
categories = ["command-line-utilities"]

[features]
default = ["std", "runtime-tokio", "regex"]
std = ["alloc", "thiserror/std"]
alloc = []
runtime-tokio = ["std", "dep:tokio"]
runtime-async-std = ["std", "dep:async-std", "dep:futures-timer", "dep:futures"]
runtime-smol = ["std", "dep:smol", "dep:futures-timer", "dep:futures"]
runtime-embassy = ["dep:embassy-time", "dep:embedded-io-async"]
regex = ["dep:regex"]
tui = ["std", "dep:crossterm", "dep:ratatui"]

[dependencies]
# Always-on (no_std compatible)
pin-project-lite = "0.2.16"
thiserror = { version = "2.0.15", default-features = false }
kmp = "0.1.1"

# Optional: runtime-tokio
tokio = { version = "1.52", features = ["io-util", "macros", "net", "process", "time", "test-util"], optional = true }

# Optional: runtime-async-std
async-std = { version = "1.13", optional = true }
futures-timer = { version = "3.0", optional = true }
futures = { version = "0.3", optional = true }

# Optional: runtime-smol
smol = { version = "2.0", optional = true }

# Optional: runtime-embassy
embassy-time = { version = "0.4", optional = true }
embedded-io-async = { version = "0.7", optional = true }

# Optional: regex
regex = { version = "1.11", optional = true }

# Optional: tui
crossterm = { version = "0.29", optional = true }
ratatui = { version = "0.30", optional = true }

# Optional utility (std, for result display)
hex = { version = "0.4", optional = true }
ascii = { version = "1.1", optional = true }

[dev-dependencies]
tokio = { version = "1.52", features = ["rt", "macros", "time", "test-util"] }
async-std = { version = "1.13", features = ["attributes"] }
smol = "2.0"
futures = "0.3"
futures-timer = "3.0"
embassy-time = { version = "0.4", features = ["mock-driver"] }
embassy-executor = { version = "0.7", features = ["arch-std", "executor-thread"] }
embassy-futures = "0.1"
critical-section = { version = "1.2", features = ["std"] }


[lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

# Allow our special-purpose nonstandard cfg attributes.
# - coverage / coverage_nightly: set by cargo-llvm-cov to enable nightly coverage attributes.
# - loom: set via RUSTFLAGS to swap in the loom model-checker for atomics in select crates.
# - utc_backend: opt-in flag for the UTC (Microsoft) Rust codegen backend, which caps type
#   alignment at 8192 bytes. Crates that intentionally exercise larger alignments (e.g.
#   multitude's over-alignment guard tests) gate the offending items on this cfg so they
#   compile out when targeting UTC. Set via RUSTFLAGS="--cfg utc_backend" in pipelines
#   that pin a UTC toolchain (ms-prod-1.95+).
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(coverage,coverage_nightly)',
    'cfg(loom)',
    'cfg(utc_backend)',
] }

[lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Lints from the `restriction` group that are not enabled by categories above but are still useful.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
multiple_unsafe_ops_per_block = "warn"
panic = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
expect_used = "warn"
unwrap_used = "warn"

# Below are undesirable lint rules that are enabled by the categories above but are not useful.
option_if_let_else = "allow"
missing_const_for_fn = "allow"
redundant_pub_crate = "allow"
should_panic_without_expect = "allow"
significant_drop_tightening = "allow"
wildcard_imports = "allow"
multiple_crate_versions = "allow"

[lints.rustdoc]
missing_crate_level_docs = "warn"
unescaped_backticks = "warn"
